<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase test</title>
<style>
  body { font-family: Arial, sans-serif; padding: 24px; background:#fff5f8; color:#5c3a44; }
  h1 { font-size: 20px; }
  #result { margin-top: 20px; padding: 16px; background:#fffafc; border:2px solid #ffc2d9; border-radius:12px; font-size: 15px; word-break: break-all; }
</style>
</head>
<body>
<h1>🔥 Testing connection to Firebase...</h1>
<div id="result">Working, please wait a few seconds...</div>

<script>
async function testFirebase() {
  const start = Date.now();
  try {
    const res = await fetch('https://chinese-class-5ed66-default-rtdb.firebaseio.com/picks.json', { cache: "no-store" });
    const elapsed = Date.now() - start;
    if (res.ok) {
      const data = await res.text();
      document.getElementById('result').innerHTML = `✅ SUCCESS! Firebase is reachable (${elapsed}ms).<br>Response: ${data}`;
    } else {
      document.getElementById('result').innerHTML = `⚠️ Reached Firebase but got status ${res.status} (${elapsed}ms)`;
    }
  } catch (e) {
    const elapsed = Date.now() - start;
    document.getElementById('result').innerHTML = `❌ FAILED after ${elapsed}ms: ${e.message}<br><br>This means Firebase itself is blocked on your network.`;
  }
}
testFirebase();
</script>
</body>
</html>
