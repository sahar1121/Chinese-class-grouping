<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选图分组 Picture Grouping</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    background: linear-gradient(135deg, #0d2e26, #143a30);
    margin: 0; padding: 16px; min-height: 100vh; color: #fff;
  }
  h1 { text-align: center; font-size: 20px; margin: 8px 0 4px; }
  .sub { text-align: center; color: #cfe; font-size: 13px; margin-bottom: 16px; opacity:0.8;}
  .screen { max-width: 480px; margin: 0 auto; }
  input[type=text] {
    width: 100%; padding: 14px; font-size: 16px; border-radius: 10px;
    border: none; margin-bottom: 12px; box-sizing: border-box;
  }
  button {
    width: 100%; padding: 14px; font-size: 16px; border-radius: 10px;
    border: none; background: #c4a050; color: #1a1a1a; font-weight: bold;
    cursor: pointer;
  }
  button:active { opacity: 0.8; }
  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .tile {
    background: #133; border: 3px solid #c4a050; border-radius: 12px;
    overflow: hidden; cursor: pointer; text-align: center;
    transition: transform 0.1s;
  }
  .tile:active { transform: scale(0.96); }
  .tile img { width: 100%; height: 100px; object-fit: cover; display:block; }
  .tile .label { padding: 6px; font-size: 15px; font-weight: bold; background:#0d2e26;}
  .result-card {
    background: #133; border: 3px solid #c4a050; border-radius: 14px;
    padding: 20px; text-align: center; margin-top: 10px;
  }
  .result-card img { width: 160px; border-radius: 10px; margin-bottom: 10px; }
  .group-list { text-align: left; margin-top: 14px; background:#0d2e26; padding:12px; border-radius:10px;}
  .group-list div { padding: 4px 0; border-bottom: 1px solid #234; font-size:14px;}
  .waiting { color: #9c9; font-size: 13px; margin-top: 8px; }
  .hidden { display: none; }
  .small-btn { margin-top:14px; background:#345; color:#fff; font-weight:normal; font-size:13px; padding:10px;}
</style>
</head>
<body>

<div class="screen" id="nameScreen">
  <h1>🎋 选择你的图片 / Pick Your Picture</h1>
  <div class="sub">Enter your name to begin</div>
  <input type="text" id="nameInput" placeholder="Your name / 你的名字">
  <button onclick="goToPicker()">Continue →</button>
  <button class="small-btn" onclick="teacherReset()">Teacher: Reset all picks</button>
</div>

<div class="screen hidden" id="pickScreen">
  <h1>🎋 选一张图片</h1>
  <div class="sub" id="greeting"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="screen hidden" id="resultScreen">
  <div class="result-card">
    <img id="resultImg" src="">
    <h2 id="resultLabel"></h2>
    <div class="waiting" id="statusMsg">Waiting for group members to join...</div>
    <div class="group-list" id="groupList"></div>
  </div>
  <button class="small-btn" onclick="changePick()">Change my selection</button>
</div>

let myName = "";
let myPick = null;
let pollTimer = null;

function goToPicker() {
  const val = document.getElementById('nameInput').value.trim();
  if (!val) { alert("Please enter your name / 请输入名字"); return; }
  myName = val;
  document.getElementById('greeting').textContent = `Hi ${myName}, tap one image:`;
  renderGrid();
  document.getElementById('nameScreen').classList.add('hidden');
  document.getElementById('pickScreen').classList.remove('hidden');
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  ITEMS.forEach(item => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = `<img src="${item.img}"><div class="label">${item.label}</div>`;
    tile.onclick = () => selectImage(item);
    grid.appendChild(tile);
  });
}

const KVDB_BUCKET = "chineseclass2026grp";
const KVDB_URL = `https://kvdb.io/${KVDB_BUCKET}/picks`;

async function getPicks() {
  try {
    const res = await fetch(KVDB_URL, { cache: "no-store" });
    if (res.ok) {
      const text = await res.text();
      return text ? JSON.parse(text) : {};
    }
  } catch (e) { console.error("getPicks error", e); }
  return {};
}

async function setPicks(picks) {
  try {
    await fetch(KVDB_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(picks)
    });
  } catch (e) { console.error("setPicks error", e); }
}

async function selectImage(item) {
  myPick = item;
  const picks = await getPicks();
  picks[myName] = item.id;
  await setPicks(picks);
  showResult();
}

function showResult() {
  document.getElementById('pickScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('resultImg').src = myPick.img;
  document.getElementById('resultLabel').textContent = myPick.label;
  refreshGroup();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshGroup, 3000);
}

async function refreshGroup() {
  try {
    const picks = await getPicks();
    const members = Object.keys(picks).filter(n => picks[n] === myPick.id);
    const listEl = document.getElementById('groupList');
    listEl.innerHTML = members.map(n => `<div>${n === myName ? '⭐ ' + n + ' (you)' : '👤 ' + n}</div>`).join('');
    document.getElementById('statusMsg').textContent =
      members.length > 1 ? `${members.length} people picked this — find each other!` : `Waiting for others to pick ${myPick.label}...`;
  } catch (e) {
    console.error(e);
  }
}

async function teacherReset() {
  if (!confirm("This clears everyone's picks. Continue?")) return;
  await setPicks({});
  alert("All picks cleared. Students can pick again.");
}

function changePick() {
  if (pollTimer) clearInterval(pollTimer);
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('pickScreen').classList.remove('hidden');
}
</script>
