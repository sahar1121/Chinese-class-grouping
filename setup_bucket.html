<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One-time setup</title>
<style>
  body { font-family: Arial, sans-serif; padding: 24px; background:#fff5f8; color:#5c3a44; }
  h1 { font-size: 20px; }
  #result { margin-top: 20px; padding: 16px; background:#fffafc; border:2px solid #ffc2d9; border-radius:12px; font-size: 15px; word-break: break-all; }
  .id { font-weight: bold; font-size: 18px; color: #e0558a; user-select: all; }
</style>
</head>
<body>
<h1>🌸 One-time setup — creating your shared storage space...</h1>
<div id="result">Working, please wait a few seconds...</div>

<script>
async function createBin() {
  try {
    const res = await fetch('https://extendsclass.com/api/json-storage/bin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ picks: {} })
    });
    const status = res.status;
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(e) { data = null; }

    if (data && data.uri) {
      const binId = data.uri.split('/').pop();
      document.getElementById('result').innerHTML =
        `✅ Success! Your storage ID is:<br><br><span class="id">${binId}</span><br><br>Copy this and send it back in the chat.`;
    } else {
      document.getElementById('result').innerHTML = `⚠️ Status ${status}. Raw response:<br>${text}`;
    }
  } catch (e) {
    document.getElementById('result').innerHTML = `❌ Error: ${e.message}`;
  }
}
createBin();
</script>
</body>
</html>
